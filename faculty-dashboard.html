<!DOCTYPE html>
<html>
<head>
    <title>Faculty Dashboard</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <h2 style="margin-left: 30px;">Faculty Dashboard</h2>

<div class="dashboard-container">

    <div class="card">
        <h3>Assigned Complaints</h3>
        <div id="facultyComplaints"></div>
    </div>

    <!-- PENDING -->
    <div class="card">
        <h3>Pending Complaints</h3>
        <div id="pendingComplaints"></div>
    </div>

    <!-- SOLVED -->
    <div class="card">
        <h3>Solved Complaints</h3>
        <div id="solvedComplaints"></div>
    </div>

    <!-- ANONYMOUS -->
    <div class="card">
        <h3>Anonymous Complaints</h3>
        <div id="anonymousComplaints"></div>
    </div>

</div>



    <div class="card">
        <h3>Actions</h3>
        <p>Review / Approve / Resolve complaints</p>
    </div>

</div>

<script src="auth.js"></script>
</body>
</html>
