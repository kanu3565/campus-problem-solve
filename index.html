<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Problem Solver</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>

<!-- 🔥 NAVBAR -->
<div class="navbar">

    <div class="left">
        <img src="logo.png" class="logo">
        <h1 class="title-text">Campus Problem Solver</h1>
    </div>

    <div class="right">
        
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>

        <a href="dashboard.html" class="profile-icon">
            <img src="profile.png">
        </a>
    </div>

</div>

<!-- 🔥 HERO SECTION -->
<div class="hero-section">
    <div class="hero-content">
        <h1>Welcome to Campus Problem Solver</h1>
        <p>Raise complaints easily and track them efficiently.</p>

        <a href="#form" class="hero-btn">Write Complaint</a>
    </div>
</div>

<!-- 🔥 FORM SECTION -->
<div class="form-section" id="form">

    <div class="form-container">

        <!-- MAIN DROPDOWN -->
        <div class="dropdown-wrapper">
            <label>Choose problem regarding</label>
            <select id="entry-select" class="custom-select">
                <option disabled selected>-- Choose an Option --</option>
                <option value="cleanliness">Cleanliness</option>
                <option value="discipline">Discipline</option>
                <option value="sports">Sports</option>
                <option value="event">Event</option>
                <option value="subject">Subject</option>
                <option value="wifi">WiFi</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- SUB DROPDOWN -->
        <div class="dropdown-wrapper">
            <label>Select specific issue</label>
            <select id="sub-entry" class="custom-select">
                <option disabled selected>-- Select main category first --</option>
            </select>
        </div>

        <!-- OTHER INPUT -->
        <div class="dropdown-wrapper" id="otherBox" style="display:none;">
            <label>Enter your issue</label>
            <input type="text" id="otherInput" class="custom-select" placeholder="Type your issue...">
        </div>

        <!-- LOCATION -->
        <div class="dropdown-wrapper">
            <label>Select Location</label>
            <select id="location" class="custom-select">
                <option disabled selected>-- Select issue first --</option>
            </select>
        </div>

        <div class="dropdown-wrapper" id="extra-box" style="display:none;">
            <label>Select more details</label>  <!-- 🔥 FIXED LABEL -->
            <select id="extra" class="custom-select">
                 <option disabled selected>-- Select more details --</option>
            </select>
       </div>

       <div class="dropdown-wrapper" id="equipment-box" style="display:none;">
            <label>Select equipment</label>
            <select id="equipment" class="custom-select">
                <option disabled selected>-- Select equipment --</option>
          </select>
       </div>

       <div class="dropdown-wrapper" id="sub-location-box" style="display:none;">
            <label>Select specific location</label>
            <select id="sub-location" class="custom-select">
                <option disabled selected>-- Select specific location --</option>
            </select>
        </div>

        <!-- DESCRIPTION -->
        <div class="dropdown-wrapper">
            <label>Describe your issue</label>
            <textarea id="description" class="custom-select"
            maxlength="200" 
            placeholder="Explain your issue clearly (location, problem, details)..."></textarea>        
        </div>

        

       

        <!-- ANONYMOUS -->
        <div class="dropdown-wrapper">
            <label>
                <input type="checkbox" id="anonymous">
                Submit as Anonymous
            </label>
        </div>

        <!-- BUTTON -->
        <button class="action-button" onclick="submitComplaint()">Submit Complaint</button>

    </div>

</div>
<script src="script.js"></script>
</body>
</html>
